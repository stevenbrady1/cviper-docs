    <text x="556" y="354" font-size="9" font-weight="700" fill="#F59E0B">THE PASTED TEXT IS NEVER LOGGED</text>
    <text x="556" y="370" font-size="7.5" fill="#334155">It is third-party personal data and often client-</text>
    <text x="556" y="382" font-size="7" fill="#6b7280">confidential. Length and outcome only — no excerpt,</text>
    <text x="556" y="394" font-size="7" fill="#6b7280">in any failure path.</text>
  </g>
