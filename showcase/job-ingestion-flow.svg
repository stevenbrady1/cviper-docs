  <rect width="920" height="790" fill="#fafbfc"/>
  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b" letter-spacing="0.4">From Advert to Tracked Job — Ingestion Data Flow</text>
  <text x="460" y="43" text-anchor="middle" font-size="9.5" fill="#64748b">Paste, upload or fetch  →  guards  →  AI extraction  →  human review  →  save</text>
  <text x="280" y="68" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569" letter-spacing="0.4">THE PATH A PASTED ADVERT TAKES</text>
  <text x="720" y="68" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569" letter-spacing="0.4">INVARIANTS</text>
  <g filter="url(#shadow)">
    <rect x="40" y="84" width="460" height="58" rx="8" fill="#eff6ff" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="40" y="84" width="460" height="16" rx="8" fill="#3B82F6" opacity="0.08"/>
    <text x="56" y="98" font-size="9" font-weight="700" fill="#3B82F6">1  ·  INPUT — whatever the user actually has</text>
    <text x="56" y="114" font-size="7.5" fill="#334155">Paste the advert text  ·  upload .pdf / .docx / .txt</text>
    <text x="56" y="126" font-size="7" fill="#6b7280">CViper Light also fetches ONE page from a link, on request</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="40" y="160" width="460" height="66" rx="8" fill="#fff7ed" stroke="#F97316" stroke-width="1.5"/>
    <rect x="40" y="160" width="460" height="16" rx="8" fill="#F97316" opacity="0.08"/>
    <text x="56" y="174" font-size="9" font-weight="700" fill="#F97316">2  ·  GUARDS — before a single AI token is spent</text>
    <text x="56" y="190" font-size="7.5" fill="#334155">Extension  ·  magic bytes  ·  size cap  ·  malware scan</text>
    <text x="56" y="202" font-size="7" fill="#6b7280">Oversize paste is TRUNCATED at 50,000 chars, never rejected</text>
    <text x="56" y="214" font-size="7" fill="#6b7280">An attacker must not be able to spend the user's AI budget</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="40" y="244" width="460" height="78" rx="8" fill="#f5f3ff" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="40" y="244" width="460" height="16" rx="8" fill="#8B5CF6" opacity="0.08"/>
    <text x="56" y="258" font-size="9" font-weight="700" fill="#8B5CF6">3  ·  AI EXTRACTION</text>
    <text x="56" y="274" font-size="7.5" fill="#334155">Prompt rule: null, NEVER guess — an invented day rate is worse</text>
    <text x="56" y="286" font-size="7" fill="#6b7280">than an empty box the user fills in themselves</text>
    <text x="56" y="298" font-size="7" fill="#6b7280">Gateway: retry  ·  truncation retry at 2x budget  ·  provider fallback</text>
    <text x="56" y="310" font-size="7" fill="#6b7280">Response validated against the schema; markup-laden fields zeroed</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="40" y="340" width="460" height="58" rx="8" fill="#f5f3ff" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="40" y="340" width="460" height="16" rx="8" fill="#8B5CF6" opacity="0.08"/>
    <text x="56" y="354" font-size="9" font-weight="700" fill="#8B5CF6">4  ·  NORMALISE</text>
    <text x="56" y="370" font-size="7.5" fill="#334155">Empty string and missing collapse into ONE null, so the form</text>
    <text x="56" y="382" font-size="7" fill="#6b7280">renders "the advert didn't say" identically every time</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="40" y="416" width="460" height="62" rx="8" fill="#ecfdf5" stroke="#10B981" stroke-width="1.5"/>
    <rect x="40" y="416" width="460" height="16" rx="8" fill="#10B981" opacity="0.08"/>
    <text x="56" y="430" font-size="9" font-weight="700" fill="#10B981">5  ·  HUMAN REVIEW — nothing has been saved yet</text>
    <text x="56" y="446" font-size="7.5" fill="#334155">Every field editable. Nulls render as empty boxes to fill in.</text>
    <text x="56" y="458" font-size="7" fill="#6b7280">This is the point of the feature: the user checks before it persists.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="40" y="496" width="460" height="72" rx="8" fill="#fef3c7" stroke="#F59E0B" stroke-width="1.5"/>
