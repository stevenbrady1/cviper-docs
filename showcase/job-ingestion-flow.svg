    <text x="556" y="258" font-size="9" font-weight="700" fill="#8B5CF6">FAIL-OPEN  —  every failure lands here</text>
    <text x="556" y="274" font-size="7.5" fill="#334155">No AI configured  ·  no provider available  ·  gateway</text>
    <text x="556" y="286" font-size="7" fill="#6b7280">exception  ·  timeout  ·  truncation  ·  JSON decode error</text>
    <text x="556" y="298" font-size="7" fill="#6b7280">→  an empty reviewable form and an honest banner.</text>
    <text x="556" y="310" font-size="7" fill="#6b7280">Never a 500. A manual save still works.</text>
  </g>
