  <text x="60" y="686" font-size="8" font-weight="600" fill="#334155">"£650 per day"</text>
  <text x="260" y="686" font-size="8" font-weight="400" fill="#64748b">CViper annualises; Light leaves null</text>
  <text x="520" y="686" font-size="8" font-weight="400" fill="#64748b">Light has no salary_period field — see ADR-011</text>
