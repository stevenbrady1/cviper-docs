  <text x="520" y="650" font-size="8" font-weight="400" fill="#64748b">A guessed number is a bad decision; an empty box is a 5-second fix</text>
  <rect x="36" y="654" width="848" height="18" fill="#ffffff"/>
  <text x="60" y="668" font-size="8" font-weight="600" fill="#334155">"£45k-£55k"</text>
