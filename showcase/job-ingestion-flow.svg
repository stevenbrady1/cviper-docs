    <text x="556" y="510" font-size="9" font-weight="700" fill="#8B5CF6">WHAT NEVER HAPPENS ON THIS PATH</text>
    <text x="556" y="526" font-size="7.5" fill="#334155">No field is auto-accepted without the user seeing it.</text>
    <text x="556" y="538" font-size="7" fill="#6b7280">No temp file outlives the request.</text>
    <text x="556" y="550" font-size="7" fill="#6b7280">No job row is written before step 6.</text>
