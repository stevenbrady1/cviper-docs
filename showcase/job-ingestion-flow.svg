    <text x="56" y="510" font-size="9" font-weight="700" fill="#F59E0B">6  ·  SAVE — now it is ordinary user input</text>
    <text x="56" y="526" font-size="7.5" fill="#334155">Re-validated as USER input, not as AI output — the user may have edited it</text>
    <text x="56" y="538" font-size="7" fill="#6b7280">Salary normalised  ·  dedupe fingerprint computed  ·  job row written</text>
    <text x="56" y="550" font-size="7" fill="#6b7280">recruiter_email is persisted but NEVER served back (data minimisation)</text>
  </g>
